name: Daily Morning News to LINE

on:
  schedule:
    # 毎朝5:43 JST に実行 (JST = UTC+9 のため UTC 20:43 = JST 翌5:43)。
    # 毎時00分ちょうどはGitHub Actions全体で混雑し遅延しやすいためずらしている。
    # さらに、実際の観測(2026/9/10〜12)でスケジュール実行が毎回ほぼ一定
    # (約1時間50分)遅れて発火していたため、その分を見込んで前倒ししている。
    # GitHub Actionsのスケジュール実行はあくまでベストエフォートであり、
    # 正確な時刻を保証するものではない点に注意(この前倒し幅も将来変わりうる)。
    - cron: "43 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning news to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_NEWS_KEYWORDS_JSON: ${{ secrets.GOOGLE_NEWS_KEYWORDS_JSON }}
        run: python scripts/send_news.py

      - name: Persist sent-article cache
        if: always()
        run: |
          if ! git diff --quiet -- data/sent_urls.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/sent_urls.json
            git commit -m "chore: update sent news cache [skip ci]"
            git push
          else
            echo "No cache changes to commit."
          fi
